# Eyano — squelette Nginx (palier 3). Adapter server_name et chemins SSL en production.

upstream eyano_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name eyano.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eyano.example.com;

  # ssl_certificate /etc/letsencrypt/live/eyano.example.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/eyano.example.com/privkey.pem;

    root /var/www/eyano/frontend;
    index index.html;

    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://eyano_api;
    }

    location /uploads/ {
        alias /var/lib/eyano/uploads/;
        autoindex off;
    }
}